<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup Page</title>
</head>
<body>

    <h1>Login Page Of My Website</h1>
    <form action="" method="post">
        <label for="login_user">Username:</label><br>
        <input type="text" name="username" id="login_user" placeholder="Enter your username"><br><br>

        <label for="login_pass">Password:</label><br>
        <input type="password" name="pass" id="login_pass" placeholder="Enter password"><br><br>

        <input type="submit" value="Login">
    </form>

    <hr>

    <h1>Sign Up</h1>
    <form action="" method="post">

        <label for="signup_user">Username:</label><br>
        <input type="text" name="username" id="signup_user" placeholder="Enter your username"><br><br>

        <label for="signup_pass">Password:</label><br>
        <input type="password" name="pass" id="signup_pass" placeholder="Enter password"><br><br>

        <label for="name">Name:</label><br>
        <input type="text" name="name" id="name" placeholder="Enter your name"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male"> Male<br>
        <input type="radio" name="gender" value="female"> Female<br>
        <input type="radio" name="gender" value="other"> Other<br><br>

        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>

        <input type="submit" value="Sign Up">
    </form>

</body>
</html>
