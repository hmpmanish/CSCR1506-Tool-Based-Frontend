<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors Example</title>
    <style>
        /* Element Selector */
        h1 ,h2 {
            color: blue;
        }

        .hmp {
            color: red;
            font-size: 30px;
        }

        #manish {
            color: green;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Element Selector Example</h1>
    <h1 class="hmp">Class Selector Example</h1>
    <h1 id="manish">ID Selector Example</h1>


    <h2>5484</h2>
</body>

</html>
