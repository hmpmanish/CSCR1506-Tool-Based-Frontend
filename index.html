<!DOCTYPE html>
<!-- Defines the document type as HTML5 -->

<html lang="en">
<!-- Root element of the HTML page -->

<head>
    <meta charset="UTF-8">
    <!-- Sets the character encoding -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the website responsive on mobile devices -->

    <title>My Website</title>
    <!-- Title shown on the browser tab -->
</head>

<body>
<!-- Visible content of the web page -->

    <h1>Welcome to My Website</h1>
    <!-- Main heading -->

    <p>This is my website hosted on GitHub.</p>
    <!-- Paragraph text -->

    <pre>
    <!-- Preformatted text: preserves spaces and line breaks -->
This is a preformatted text.
    </pre>

    <hr>
    <!-- Horizontal line used to separate sections -->

    <p>hmp<br>manish</p>
    <!-- Line break using <br> -->

    <h2>Text Formatting Tags</h2>
    <!-- Sub-heading -->

    <b>Bold Text</b>
    <!-- Bold text (visual only) -->

    <br>

    <strong>Important Bold Text</strong>
    <!-- Important text with semantic meaning -->

    <br>

    <i>Italic Text</i>
    <!-- Italic text -->

    <br>

    <em>Emphasized Text</em>
    <!-- Emphasized text with meaning -->

    <br>

    <mark>Highlighted Text</mark>
    <!-- Highlighted text -->

    <h3>Profile Image</h3>
    <!-- Heading level 3 -->

    <img src="https://avatars.githubusercontent.com/u/69865384?v=4"
         alt="Profile Picture" width="150">
    <!-- Displays an image -->

    <h4>Heading Level 4</h4>
    <h5>Heading Level 5</h5>
    <h6>Heading Level 6</h6>
    <!-- Smaller headings -->

</body>
</html>
