<!DOCTYPE html>
<html>
<head>
    <title>Form</title>

<style>
body {
    font-family: Arial;
    background-color: #f2f2f2;
}

form {
    width: 300px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    border: 1px solid gray;
    transition: 0.3s;
}

input:focus, textarea:focus {
    border-color: blue;
}

input:hover {
    background-color: #f0f0f0;
}

button {
    width: 100%;
    padding: 10px;
    background: blue;
    color: white;
    border: none;
}

button:hover {
    background: darkblue;
}
</style>

</head>
<body>

<form>
    <h2>Registration</h2>

    <label>Name:</label>
    <input type="text" required>

    <label>Email:</label>
    <input type="email" required>

    <label>Password:</label>
    <input type="password" required>

    <label>Gender:</label>
    <input type="radio" name="g"> Male
    <input type="radio" name="g"> Female

    <label>Skills:</label>
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS

    <label>Country:</label>
    <select>
        <option>India</option>
        <option>USA</option>
    </select>

    <label>Message:</label>
    <textarea></textarea>

    <button>Submit</button>
</form>

</body>
</html>
