<!DOCTYPE html>
<html>
<head>
    <title>Transition Button</title>

<style>
button {
    background-color: blue;
    color: white;
    padding: 15px 25px;
    border: none;
    font-size: 18px;
    transition: 0.3s;
}

button:hover {
    background-color: red;
    transform: scale(1.1);
}
</style>

</head>
<body>

<button>Hover Me</button>

</body>
</html>
